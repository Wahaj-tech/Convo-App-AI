      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="0" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
